[package]
name = "taildesk"
description = "App desktop do TailDesk (host + controlador)."
homepage = "https://github.com/yurisanp/taildesk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
taildesk-ui.workspace = true
taildesk-platform.workspace = true
taildesk-tsapi.workspace = true
taildesk-session.workspace = true
taildesk-transport.workspace = true
taildesk-overlay.workspace = true
taildesk-proto.workspace = true
taildesk-keyboard.workspace = true
taildesk-files.workspace = true
taildesk-update.workspace = true
taildesk-codec.workspace = true
taildesk-media.workspace = true
taildesk-render.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
slint = { version = "=1.18.1", features = ["unstable-winit-030", "unstable-wgpu-30", "renderer-femtovg-wgpu"] }
pollster = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[package.metadata.deb]
name = "taildesk"
maintainer = "TailDesk contributors"
copyright = "2026, The TailDesk contributors"
section = "net"
priority = "optional"
extended-description = "Acesso remoto (desktop remoto e troca de arquivos) pela tailnet do Tailscale."
assets = [
  ["target/release/taildesk", "usr/bin/", "755"],
  ["target/release/taildesk-cli", "usr/bin/", "755"],
  ["../../packaging/linux/taildesk.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux/taildesk.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "taildesk"
summary = "Acesso remoto pela tailnet do Tailscale"
assets = [
  { source = "target/release/taildesk", dest = "/usr/bin/taildesk", mode = "755" },
  { source = "target/release/taildesk-cli", dest = "/usr/bin/taildesk-cli", mode = "755" },
  { source = "../../packaging/linux/taildesk.desktop", dest = "/usr/share/applications/taildesk.desktop", mode = "644" },
  { source = "../../packaging/linux/taildesk.svg", dest = "/usr/share/icons/hicolor/scalable/apps/taildesk.svg", mode = "644" },
  { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/taildesk/LICENSE-MIT", mode = "644", doc = true },
  { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/taildesk/LICENSE-APACHE", mode = "644", doc = true },
]
