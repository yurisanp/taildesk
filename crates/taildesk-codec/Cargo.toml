[package]
name = "taildesk-codec"
description = "Traits VideoEncoder/VideoDecoder, conversão de cor e o backend openh264."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# H.264 em software (BSD-2-Clause). O feature padrão `source` compila o OpenH264 junto (precisa de
# compilador C++); carregar o binário da Cisco em tempo de execução vem antes da release com vídeo.
openh264 = "0.9.8"

[target.'cfg(target_os = "linux")'.dependencies]
# NVENC/NVDEC e VA-API abertos em tempo de execução (ISC).
libloading = "0.8"

[lints]
workspace = true
