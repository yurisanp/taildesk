[package]
name = "taildesk-session"
description = "Máquina de estados da sessão, autorização e consentimento."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5"
# Só para ligar o gerador de sal do sistema (`OsRng`) do argon2.
password-hash = { version = "0.5", features = ["getrandom"] }
taildesk-keyboard.workspace = true
taildesk-overlay.workspace = true
taildesk-proto.workspace = true
taildesk-files.workspace = true
taildesk-transport.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "fs"] }

[lints]
workspace = true
