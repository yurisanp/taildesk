[package]
name = "taildesk-platform"
description = "Código por SO: instância única, bandeja e, nas próximas etapas, captura, input, cursor e segredos (Windows, Linux Wayland/X11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
taildesk-keyboard.workspace = true
taildesk-proto.workspace = true
# Segredos no cofre do sistema (Secret Service no Linux, Credential Manager no Windows).
keyring-core = "1"
# PNG da área de transferência: o Windows guarda imagens em DIB (MIT OR Apache-2.0).
png = "0.18"

# Pergunta ao D-Bus se há bandeja (StatusNotifierWatcher). O Slint já traz o zbus para a bandeja.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Portais RemoteDesktop e ScreenCast (MIT). Sem tokio: o zbus do Slint usa async-io e os dois
# têm de concordar no runtime do zbus.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "clipboard", "file_chooser", "open_uri", "remote_desktop", "screencast"] }
futures-util = { version = "0.3", default-features = false }
# Recebe os quadros de cada monitor do portal (MIT). Liga na libpipewire-0.3 do sistema; o build
# precisa do pacote -dev e do libclang (bindgen).
pipewire = "0.10"
# Lê o layout do teclado (keymap XKB); carregado em tempo de execução, sem pacote -dev.
xkbcommon-dl = "0.4"
# Arrastar arquivos para a janela no Wayland (o winit não faz): conexão convidada no wl_display
# da janela (MIT). `system` + `dlopen`: a mesma libwayland-client do winit, carregada em execução.
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
rustix = { version = "1", features = ["event", "fs", "pipe"] }
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# Som do sistema: WASAPI, loopback na saída padrão (Apache-2.0). No Linux o som vai pelo PipeWire.
cpal = "0.18.2"
windows-native-keyring-store = { version = "1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Desktop Duplication (D3D11 + DXGI) é COM; o crate `windows` (MIT/Apache) cuida das interfaces.
# Diálogo de abrir arquivos (IFileOpenDialog) para o painel de arquivos (MIT).
rfd = { version = "0.15", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }

[lints]
workspace = true
