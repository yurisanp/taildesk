name: Release

# Publica uma versão: `git tag v0.1.0 && git push origin v0.1.0`, ou "Run workflow" (workflow_dispatch)
# na main com o campo `tag` (ex.: v0.1.0); nesse caso a release cria a tag no commit rodado.
# Tags com hífen (v0.1.0-beta.1) saem como pre-release.
# Em PRs que mexem no empacotamento, gera os pacotes sem publicar (só artefatos do workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.0). Vazio = só gera os pacotes."
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "apps/taildesk/Cargo.toml"

env:
  CARGO_TERM_COLOR: always
  # openh264 sem SIMD é ~4x mais lento: o build falha se faltar o nasm.
  TAILDESK_EXIGIR_NASM: "1"
  # Tag da release: a tag empurrada ou a informada no workflow_dispatch.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Versão (tag precisa bater com o Cargo.toml)
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag inválida: $RELEASE_TAG"
              exit 1
            fi
            tag="${RELEASE_TAG#v}"
            if [[ "${tag%%-*}" != "$cargo_version" ]]; then
              echo "::error::tag $RELEASE_TAG não bate com a versão $cargo_version do Cargo.toml"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$cargo_version-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    # Ubuntu mais antigo suportado = glibc mais antiga = AppImage e tar.gz rodam em mais distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # O app gráfico (Slint) liga o fontconfig e a captura liga a libpipewire (bindgen: libclang).
      - name: Dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libpipewire-0.3-dev libclang-dev nasm ninja-build cmake
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Ferramentas de empacotamento
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: zsyncmake (gera o .zsync do AppImage para auto update)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsync
      # O crate pipewire 0.10 não compila com os cabeçalhos 0.3.48 do 22.04: usa os da 1.0.5
      # (Ubuntu 24.04) e liga a biblioteca do sistema; o passo seguinte confere os símbolos.
      - name: Cabeçalhos da PipeWire 1.0.5
        run: |
          packaging/linux/pipewire-headers.sh 1.0.5 "$RUNNER_TEMP/pipewire"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pipewire/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p taildesk -p taildesk-cli
      - name: Símbolos da PipeWire presentes na 0.3.48 do sistema
        run: packaging/linux/check-pipewire-symbols.sh /usr/lib/x86_64-linux-gnu/libpipewire-0.3.so.0 target/release/taildesk target/release/taildesk-cli
      # PyroWave (codec wavelet em Vulkan, MIT): a biblioteca vai junto, em usr/lib. Se o build
      # dele falhar, a release sai sem o codec (o app só não o anuncia).
      - name: PyroWave
        continue-on-error: true
        run: packaging/pyrowave/build.sh target/release
      - run: packaging/linux/build-packages.sh "${{ needs.version.outputs.version }}" dist
      - name: Teste rápido do AppImage e do tar.gz
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/TailDesk-*.AppImage cli --version
          # Update information embutida (seção .upd_info) e o .zsync ao lado do AppImage.
          objcopy -O binary --only-section=.upd_info dist/TailDesk-*.AppImage /dev/stdout | tr -d '\0' | tee "$RUNNER_TEMP/updinfo"; echo
          grep -q '^gh-releases-zsync|yurisanp|taildesk|' "$RUNNER_TEMP/updinfo"
          test -s dist/TailDesk-*.AppImage.zsync
          tar -xzf dist/taildesk-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/taildesk-*/usr/bin/taildesk-cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p taildesk -p taildesk-cli
      # PyroWave (codec wavelet em Vulkan, MIT): a DLL vai ao lado do taildesk.exe.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: PyroWave
        continue-on-error: true
        shell: bash
        env:
          CC: cl
          CXX: cl
        run: packaging/pyrowave/build.sh target/release
      - name: Pacote .zip
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $dir = "taildesk-$v-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir, dist | Out-Null
          Copy-Item target/release/taildesk.exe, target/release/taildesk-cli.exe, LICENSE-MIT, LICENSE-APACHE, README.md $dir
          if (Test-Path target/release/licencas-pyrowave) {
            Copy-Item target/release/*pyrowave-shared*.dll $dir
            Copy-Item target/release/licencas-pyrowave/* $dir
          }
          Compress-Archive -Path $dir -DestinationPath "dist/$dir.zip"
          & "$dir/taildesk-cli.exe" --version
      - name: Instalador MSI (WiX)
        shell: pwsh
        env:
          # Senha do certificado (.pfx em base64 no secret WINDOWS_PFX_BASE64). Sem os dois, o
          # MSI sai sem assinatura — serve para instalar, mas o Windows mostra "editor
          # desconhecido" no SmartScreen.
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $full = "${{ needs.version.outputs.version }}"
          # O ProductVersion do Windows Installer é só X.Y.Z (sem o sufixo -beta/-dev).
          $msiver = ($full -split '-')[0]
          dotnet tool install --global wix --version 5.0.2
          $msi = "dist/TailDesk-$full-x64.msi"
          wix build packaging/windows/taildesk.wxs -arch x64 -d Version=$msiver -d BinDir=target/release -o $msi
          if (-not (Test-Path $msi)) { throw "o MSI não foi gerado" }
          if ($env:PFX_B64 -and $env:PFX_PASS) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
            $signtool = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f "$env:RUNNER_TEMP/cert.pfx" /p $env:PFX_PASS `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $msi
            if ($LASTEXITCODE -ne 0) { throw "a assinatura do MSI falhou" }
          } else {
            Write-Host "Sem certificado (WINDOWS_PFX_BASE64): MSI sem assinatura."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "TailDesk ${RELEASE_TAG}" --target "$GITHUB_SHA")
          [[ "$RELEASE_TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  # Atualiza o pacote taildesk-bin no AUR. Só com o secret AUR_SSH_KEY (chave SSH do mantenedor);
  # pre-releases (tag com "-") não vão para o AUR, que segue a versão estável.
  aur:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    needs: [version, publish]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar ao AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "Sem AUR_SSH_KEY: pulando a publicação no AUR."
            exit 0
          fi
          pacman -Syu --noconfirm --needed base-devel git openssh
          # makepkg --printsrcinfo não roda como root.
          useradd -m builder && chown -R builder: "$GITHUB_WORKSPACE"
          install -d -m700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/aur && chmod 600 /home/builder/.ssh/aur
          ssh-keyscan aur.archlinux.org > /home/builder/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > /home/builder/.ssh/config
          chown -R builder: /home/builder/.ssh
          sudo -u builder env VERSION="$VERSION" bash packaging/arch/update-aur.sh "$VERSION"

  # Build no COPR (Fedora). Só com o secret COPR_TOKEN (o arquivo ~/.config/copr da conta).
  copr:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [version, publish]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar ao COPR
        env:
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ -z "$COPR_TOKEN" ]]; then
            echo "Sem COPR_TOKEN: pulando a build no COPR."
            exit 0
          fi
          dnf install -y copr-cli rpm-build rpmdevtools
          install -d -m700 ~/.config
          printf '%s\n' "$COPR_TOKEN" > ~/.config/copr
          rpmdev-setuptree
          cp packaging/copr/taildesk.spec ~/rpmbuild/SPECS/
          # Baixa o Source0 (tarball da release) e monta só o SRPM; o COPR compila.
          spectool -g -R --define "taildesk_version $VERSION" ~/rpmbuild/SPECS/taildesk.spec
          srpm=$(rpmbuild -bs --define "taildesk_version $VERSION" ~/rpmbuild/SPECS/taildesk.spec \
            | grep -oE '/[^ ]+\.src\.rpm' | tail -1)
          copr-cli build yurisanp/taildesk "$srpm"
