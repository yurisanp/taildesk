# Política de privacidade do app Android no GitHub Pages (android-detalhado.md §9.3):
# https://yurisanp.github.io/taildesk/privacidade/. Publica só apps/android/site (a pasta docs/
# tem os documentos de contexto, que não viram site). Precisa do Pages ligado em
# Settings → Pages → Source: GitHub Actions.
name: Política de privacidade (Pages)

on:
  push:
    branches: [main]
    paths: ["apps/android/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/android/site
      - id: deploy
        uses: actions/deploy-pages@v4
