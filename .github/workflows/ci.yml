name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # O Slint (apps/taildesk-prototipo) liga o fontconfig via pkg-config no build.
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Distros Linux-alvo além do Ubuntu (docs/context/10-plano-windows-linux.md §2.6).
  # Rodam dentro do container oficial de cada distro, com o toolchain do rust-toolchain.toml.
  distro:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            deps: dnf install -y --setopt=install_weak_deps=False gcc git curl pkgconf-pkg-config fontconfig-devel
          - distro: archlinux
            image: archlinux:latest
            deps: pacman -Syu --noconfirm --needed base-devel git curl fontconfig
    steps:
      - name: Dependências do sistema
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - name: Rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
