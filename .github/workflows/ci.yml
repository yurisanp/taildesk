name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # openh264 sem SIMD é ~4x mais lento: o build falha se faltar o nasm.
  TAILDESK_EXIGIR_NASM: "1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # O Slint liga o fontconfig, a captura de tela e o som ligam a libpipewire (bindgen precisa do
      # libclang) e o Opus compila com cmake.
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libpipewire-0.3-dev libclang-dev mesa-vulkan-drivers nasm cmake
      # Sem o nasm o openh264 compila sem SIMD.
      - name: nasm (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Licenças (AGENTS.md), vulnerabilidades do RustSec e origem das dependências: `deny.toml`.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Distros Linux-alvo além do Ubuntu (docs/context/10-plano-windows-linux.md §2.6).
  # Rodam dentro do container oficial de cada distro, com o toolchain do rust-toolchain.toml.
  distro:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            deps: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git curl pkgconf-pkg-config fontconfig-devel pipewire-devel clang-devel nasm cmake
          - distro: archlinux
            image: archlinux:latest
            deps: pacman -Syu --noconfirm --needed base-devel git curl fontconfig pipewire clang nasm cmake
    steps:
      - name: Dependências do sistema
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - name: Rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  empacotamento:
    name: metadados dos pacotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: AppStream MetaInfo
        run: appstreamcli validate --no-net packaging/linux/io.github.yurisanp.TailDesk.metainfo.xml
      - name: .desktop
        run: desktop-file-validate packaging/linux/taildesk.desktop
