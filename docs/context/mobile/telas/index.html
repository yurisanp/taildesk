<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f1f2f5; --line:#e3e5ea; --text:#1d2129; --muted:#6b7280;
  --primary:#2f5fe0; --primary-text:#fff; --ok:#1f9d55; --warn:#d48806; --off:#9aa0aa; --danger:#d93838;
  --remote:#1e3a5f;
}
.dark{
  --bg:#0f1115; --surface:#181b21; --surface-2:#20242c; --line:#2c313b; --text:#e8eaee; --muted:#9aa1ad;
  --primary:#5b84ff;
}
*{box-sizing:border-box}
body{margin:0;background:#dfe3ea;font:14px/1.4 Inter,"Segoe UI",Roboto,system-ui,sans-serif;color:#1d2129;padding:24px}
h1{font-size:22px;margin:0 0 4px} .lead{color:#555;margin:0 0 24px;max-width:900px}
.grid{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{margin:0} figcaption{font-size:13px;color:#444;margin-top:8px;max-width:380px}
figcaption b{display:block;color:#111}

/* aparelhos */
.dev{background:#111;border-radius:38px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.scr{background:var(--bg);color:var(--text);border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone .scr{width:360px;height:760px}
.land .scr{width:780px;height:360px}
.tab{border-radius:26px}.tab .scr{width:1024px;height:700px;border-radius:18px}
.status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;flex:none}
.status .r{display:flex;gap:6px;align-items:center}
.vpn{font-size:10px;border:1.5px solid currentColor;border-radius:3px;padding:0 3px;line-height:12px}

/* comuns */
.appbar{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;flex:none}
.appbar h2{font-size:24px;margin:0;flex:1}
.logo{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);font-size:16px}
.search{margin:0 18px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--muted)}
.body{flex:1;overflow:hidden;padding:0 18px}
.sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.os{width:36px;height:36px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none}
.grow{flex:1;min-width:0}.name{font-weight:600}.sub{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px;vertical-align:1px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.off{background:var(--off)}.bad{background:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.d{color:var(--danger)}
.btn.block{display:flex;width:100%;padding:13px}
.btn.sm{padding:6px 11px;font-size:13px}
.star{color:#d4a20b}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:8px 0 18px;flex:none}
.nav div{text-align:center;font-size:11px;color:var(--muted)} .nav div.on{color:var(--primary);font-weight:600}
.nav i{display:block;font-style:normal;font-size:18px}
.banner{margin:0 18px 8px;padding:10px 12px;border-radius:12px;background:#fff6e0;color:#7a5200;font-size:13px;display:flex;gap:8px}
.dark .banner{background:#3a2e10;color:#f3cf7a}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:10px 18px 22px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border:0} .kv span:first-child{color:var(--muted)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.big-ic{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:40px;background:var(--surface-2);margin-bottom:18px}
.steps{display:flex;gap:6px;justify-content:center;margin:14px 0}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--line)} .steps i.on{background:var(--primary)}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:10px;background:#fff;top:2px;left:2px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{background:var(--primary)} .toggle.on::after{left:20px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg div{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg div.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* tela remota simulada */
.remote{position:absolute;inset:0;background:linear-gradient(135deg,#24476f,#16304d);overflow:hidden}
.rwin{position:absolute;background:#fff;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.35);overflow:hidden;color:#222;font-size:9px}
.rwin .tb{height:16px;background:#e9ecf1;display:flex;align-items:center;padding:0 6px;gap:3px;font-size:8px;color:#555}
.rwin .ln{height:5px;background:#dfe3e8;border-radius:2px;margin:5px 8px}
.rterm{background:#1b1e24;color:#9fe39f;font:9px/1.5 ui-monospace,monospace;padding:6px 8px}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:18px;background:rgba(10,15,25,.8)}
.cursor{position:absolute;width:0;height:0;border-left:7px solid #fff;border-right:7px solid transparent;border-bottom:12px solid transparent;filter:drop-shadow(0 0 1px #000);transform:skewX(-8deg)}
.cursor.big{border-left-width:11px;border-bottom-width:18px}
.sbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(20,24,31,.88);color:#fff;border-radius:14px;padding:5px 6px;font-size:12px;white-space:nowrap}
.sbar .c{padding:5px 9px;border-radius:9px} .sbar .c.on{background:rgba(255,255,255,.16)}
.sbar .x{background:#d93838;border-radius:9px;padding:5px 10px;font-weight:600}
.handle{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:54px;height:6px;border-radius:3px;background:rgba(255,255,255,.7)}
.hud{position:absolute;right:10px;bottom:26px;background:rgba(20,24,31,.8);color:#fff;font-size:11px;border-radius:8px;padding:4px 8px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;background:rgba(20,24,31,.9);color:#fff;font-size:12px;border-radius:10px;padding:7px 12px;white-space:nowrap}
.keys{display:flex;gap:5px;padding:6px 8px;background:#d5d8de;overflow:hidden}
.keys span{background:#fff;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600;color:#222;box-shadow:0 1px 0 #9aa}
.keys span.on{background:var(--primary);color:#fff}
.kb{background:#cfd3d9;padding:6px 6px 8px}
.kb .r{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.kb .r span{flex:1;max-width:58px;background:#fff;border-radius:5px;height:30px;display:grid;place-items:center;font-size:14px;color:#222;box-shadow:0 1px 0 #999}
.kb .r span.w{max-width:none;flex:5}.kb .r span.m{background:#adb3bc;max-width:80px;flex:1.5;font-size:12px}
.mon{display:flex;gap:10px}
.mon .m{flex:1;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px}
.mon .m.on{border-color:var(--primary)}
.mon .th{height:56px;border-radius:6px;background:linear-gradient(135deg,#24476f,#16304d);margin-bottom:6px;position:relative}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}
.qr{width:170px;height:170px;background:
 repeating-linear-gradient(90deg,#111 0 8px,#fff 8px 13px,#111 13px 17px,#fff 17px 26px),#fff;position:relative;border:10px solid #fff;outline:1px solid #ddd}
.qr::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 6px,transparent 6px 15px)}
.cam{flex:1;background:radial-gradient(circle at 50% 40%,#4b5563,#111827);position:relative;display:grid;place-items:center}
.viewfinder{width:220px;height:220px;border:3px solid #fff;border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.desk{background:#f3f4f6;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;width:900px;color:#1d2129}
.desk .tt{height:34px;background:#e7e9ee;display:flex;align-items:center;padding:0 14px;font-size:12px;gap:10px;color:#444}
.chip{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:#e3f5ea;color:#16794a}.chip.warn{background:#fff1d6;color:#8a5a00}
.dark .chip.ok{background:#173726;color:#7bd8a3}
.notif{margin:8px 10px;background:var(--surface);border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px}
</style>
</head>
<body>
<h1>TailDesk Mobile · modelos de telas</h1>
<p class="lead">Mockups estáticos (HTML) para Android e iOS, no visual do protótipo desktop (<code>design/12-levantamento-ux.md</code>). IDs <b>MF-*</b> são os requisitos de <code>mobile/requisitos.md</code>. Os mesmos layouts servem aos dois SOs; diferenças de plataforma estão nas legendas.</p>
<div class="grid">

<!-- 01 Onboarding: Tailscale -->
<figure id="s01"><div class="dev phone"><div class="scr">
  <div class="status"><span>09:41</span><span class="r">5G ▮▮▮ 82%</span></div>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <div class="center">
    <div class="big-ic">🔌</div>
    <h2 style="margin:0 0 8px;font-size:22px">Ligue o Tailscale</h2>
    <p style="color:var(--muted);margin:0 0 18px">O TailDesk só conecta aparelhos da sua rede Tailscale. O app do Tailscale está instalado, mas desligado.</p>
    <div class="card" style="width:100%;text-align:left">
      <div class="row"><span class="dot ok"></span><div class="grow">Tailscale instalado <span class="sub">· 1.104.1</span></div></div>
      <div class="row"><span class="dot bad"></span><div class="grow">Conectado à tailnet</div></div>
      <div class="row"><span class="dot off"></span><div class="grow">TailDesk dentro do túnel</div></div>
    </div>
  </div>
  <div style="padding:0 22px 30px;display:grid;gap:10px">
    <div class="btn p block">Abrir o Tailscale</div>
    <div class="btn block">Já liguei, verificar de novo</div>
  </div>
</div></div><figcaption><b>01 · Primeira execução: checagem do Tailscale (MF-01)</b>Estados de requisitos §4.3. Variantes: "Instale o Tailscale" (botão para a loja), "Outra VPN está ativa" e "O Tailscale está deixando o TailDesk de fora" (split tunneling). No iOS a versão não é lida.</figcaption></figure>

<!-- 02 Encontrar computadores -->
<figure id="s02"><div class="dev phone"><div class="scr">
  <div class="status"><span>09:42</span><span class="r"><span class="vpn">VPN</span> 5G 82%</span></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="center" style="justify-content:flex-start;padding-top:20px">
    <div class="big-ic">🖥️</div>
    <h2 style="margin:0 0 8px;font-size:22px">Encontre seus computadores</h2>
    <p style="color:var(--muted);margin:0 0 20px">No computador, abra TailDesk → Configurações → Celulares → <b>Conectar um celular</b> e leia o código.</p>
    <div style="display:grid;gap:10px;width:100%">
      <div class="btn p block">📷 Ler código QR</div>
      <div class="btn block">Digitar o código de 6 letras</div>
      <div class="btn block">Digitar o nome do computador</div>
    </div>
    <p class="sub" style="margin-top:18px">Por que parear? O celular não consegue ver a lista da tailnet sozinho. Um computador pareado mostra quais máquinas têm TailDesk.</p>
  </div>
  <div style="padding:0 22px 30px;text-align:center" class="sub">Pular por enquanto</div>
</div></div><figcaption><b>02 · Encontrar computadores (MF-11, MF-20/21)</b>Pareamento é o caminho principal; nome MagicDNS ou IP 100.x é a alternativa. Token da API do Tailscale fica em Configurações → Avançado.</figcaption></figure>

<!-- 03 Leitor de QR + QR no desktop -->
<figure id="s03"><div style="display:flex;gap:18px;align-items:flex-start">
<div class="dev phone"><div class="scr" style="background:#000;color:#fff">
  <div class="status" style="color:#fff"><span>09:42</span><span class="r"><span class="vpn">VPN</span> 82%</span></div>
  <div class="cam"><div class="viewfinder"></div>
    <div style="position:absolute;bottom:90px;left:0;right:0;text-align:center;font-size:14px">Aponte para o código no computador</div>
    <div style="position:absolute;bottom:30px;left:22px;right:22px;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;font-size:13px">✓ desktop-casa · 100.101.12.4<br><span style="opacity:.7">Pareando…</span></div>
  </div>
</div></div>
<div class="desk" style="width:420px;margin-top:120px">
  <div class="tt">TailDesk · Conectar um celular</div>
  <div style="padding:20px;display:flex;gap:18px;align-items:center">

    <div><div class="name" style="font-size:16px">Leia com o app TailDesk</div>
      <p class="sub">Ou digite o código no celular:</p>
      <div style="font:600 26px ui-monospace,monospace;letter-spacing:4px">K7Q-4MZ</div>
      <p class="sub">Vale por 4:52. Só celulares da sua tailnet conseguem usar.</p></div>
  </div>
</div></div><figcaption><b>03 · Pareamento por QR (MF-20/21)</b>À direita, a tela nova do desktop. O QR leva nome MagicDNS, IP, porta, impressão digital do certificado e código de uso único.</figcaption></figure>

      <div class="row"><div class="os">🐧</div><div class="grow"><div class="name"><span class="star">★</span> servidor-homelab</div><div class="sub"><span class="dot ok"></span>online · Ubuntu 24.04</div></div><div class="btn p sm">Conectar</div></div>
    </div>

</div></div><figcaption><b>04 · Dispositivos, tela inicial (MF-10..14)</b>Favoritos com probe leve de estado; o restante vem do desktop pareado (rótulo "via desktop-casa"). Um toque em Conectar; tocar na linha abre o detalhe.</figcaption></figure>

</div></div><figcaption><b>05 · Detalhe do dispositivo (MF-13)</b>Folha inferior com as ações rápidas do desktop (12 §5.2). "Último caminho" vem do PathInfo informado pelo host.</figcaption></figure>

<!-- 06 Conectando -->
